# Deploys main after the tests pass. Pick the target with the repository
# variable DEPLOY_TARGET (Settings → Secrets and variables → Actions → Variables):
#   vps    → SSH into your server and rebuild (Oracle Always Free, Hetzner, any Ubuntu VPS)
#            secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY   optional variable: VPS_APP_DIR
#   render → call a Render deploy hook   secret: RENDER_DEPLOY_HOOK_URL
# With no DEPLOY_TARGET set, only the tests run.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  vps:
    needs: test
    if: vars.DEPLOY_TARGET == 'vps'
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd "${{ vars.VPS_APP_DIR || 'producttryon' }}"
            git fetch --depth 1 origin main
            git reset --hard origin/main
            docker compose up -d --build
            docker image prune -f

  render:
    needs: test
    if: vars.DEPLOY_TARGET == 'render'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: curl -fsS -X POST "$HOOK" > /dev/null
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
