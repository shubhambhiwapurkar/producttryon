<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set Up Your Store</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 4l26 22-12 34H18L6 26z' fill='%23b08d57'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="wizard-head container">
    <h1>Set up your virtual try-on</h1>
    <p class="hint">Ready in a few minutes. No technical knowledge needed.</p>
  </header>

  <main class="container narrow">
    <nav id="stepper" aria-label="Setup progress"></nav>
    <div id="global-error" class="msg msg-error" role="alert" hidden></div>
    <section class="card wizard-step" id="step-body" aria-live="polite"></section>
    <div class="wizard-nav">
      <button type="button" class="btn" id="btn-back">Back</button>
      <button type="button" class="btn btn-primary" id="btn-next">Next</button>
    </div>
  </main>

  <script type="module" src="/static/onboard.js"></script>
</body>
</html>
